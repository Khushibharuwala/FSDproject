<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - SkillConnect</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* Main Container */

        .profile-container {
            width: 85%;
            max-width: 1000px;
            margin: 40px auto;
        }


        /* Profile Header */

        .profile-header {
            background: linear-gradient(135deg, #6C63FF, #5DE0E6);
            color: white;
            padding: 35px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }


        /* Profile Photo */

        .profile-photo {
            width: 120px;
            height: 120px;

            border-radius: 50%;

            background: white;

            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 50px;

            color: #6C63FF;

            border: 5px solid white;

            overflow: hidden;
        }


        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* Upload Button */

        .photo-btn {
            display: block;

            margin: 15px auto 0;

            background: white;
            color: #6C63FF;

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.3s;
        }


        .photo-btn:hover {
            background: #f0f0f0;

            transform: scale(1.03);
        }


        /* Profile Heading */

        .profile-header h1 {
            margin: 15px 0 5px;
        }


        .profile-header p {
            margin: 5px;
        }


        /* Profile Card */

        .profile-card {
            background: white;

            padding: 35px;

            border-radius: 0 0 20px 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }


        /* Section Title */

        .section-title {
            color: #6C63FF;

            margin-bottom: 20px;

            border-bottom: 2px solid #eee;

            padding-bottom: 10px;
        }


        /* Form Row */

        .form-row {
            display: flex;

            gap: 20px;
        }


        /* Form Group */

        .form-group {
            flex: 1;

            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #444;
        }


        /* Inputs */

        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            padding: 12px;

            border: 2px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {

            border-color: #6C63FF;

            box-shadow: 0 0 5px rgba(108, 99, 255, 0.2);
        }


        /* About */

        textarea {

            height: 100px;

            resize: none;
        }


        /* Skills */

        .skills-container {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 10px;
        }


        .skill {

            background: #eeeaff;

            color: #6C63FF;

            padding: 8px 15px;

            border-radius: 20px;

            font-weight: bold;
        }


        /* Buttons */

        .button-container {

            display: flex;

            gap: 15px;

            margin-top: 25px;
        }


        .save-btn {

            background: #6C63FF;

            color: white;

            border: none;

            padding: 13px 25px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            transition: 0.3s;
        }


        .save-btn:hover {

            background: #574bdb;
        }


        .back-btn {

            background: #ddd;

            color: #333;

            border: none;

            padding: 13px 25px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            transition: 0.3s;
        }


        .back-btn:hover {

            background: #ccc;
        }


        /* Responsive */

        @media(max-width:700px) {

            .form-row {

                flex-direction: column;

                gap: 0;
            }


            .profile-container {

                width: 95%;
            }


            .profile-card {

                padding: 20px;
            }

        }

    </style>

</head>


<body>


<div class="profile-container">


    <!-- ========================= -->
    <!-- PROFILE HEADER -->
    <!-- ========================= -->

    <div class="profile-header">


        <!-- Profile Photo -->

        <div class="profile-photo" id="profilePhoto">

            👤

        </div>


        <!-- Hidden File Input -->

        <input
            type="file"
            id="photoUpload"
            accept="image/*"
            style="display:none;"
        >


        <!-- Upload Button -->

        <button
            type="button"
            class="photo-btn"
            onclick="document.getElementById('photoUpload').click()"
        >

            📷 Upload Profile Photo

        </button>


        <!-- Name -->

        <h1 id="displayName">

            Your Name

        </h1>


        <!-- College -->

        <p id="displayCollege">

            Your College

        </p>


        <!-- Course -->

        <p id="displayCourse">

            Your Course

        </p>


    </div>



    <!-- ========================= -->
    <!-- PROFILE FORM -->
    <!-- ========================= -->

    <div class="profile-card">


        <h2 class="section-title">

            Personal Information

        </h2>


        <form id="profileForm">


            <!-- Name + Email -->

            <div class="form-row">


                <div class="form-group">

                    <label>

                        Full Name

                    </label>


                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>

                        Email

                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


            </div>



            <!-- College + Course -->

            <div class="form-row">


                <div class="form-group">

                    <label>

                        College

                    </label>


                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college"
                    >

                </div>



                <div class="form-group">

                    <label>

                        Course

                    </label>


                    <input
                        type="text"
                        id="course"
                        placeholder="Example: B.Tech CSE"
                    >

                </div>


            </div>



            <!-- About -->

            <div class="form-group">

                <label>

                    About Me

                </label>


                <textarea
                    id="about"
                    placeholder="Tell something about yourself..."
                ></textarea>

            </div>



            <!-- ========================= -->
            <!-- SKILLS -->
            <!-- ========================= -->


            <h2 class="section-title">

                Skills

            </h2>



            <!-- Teach Skills -->

            <div class="form-group">

                <label>

                    Skills I Can Teach

                </label>


                <input
                    type="text"
                    id="teachSkills"
                    placeholder="Example: C++, Python, React"
                >

            </div>



            <!-- Learn Skills -->

            <div class="form-group">

                <label>

                    Skills I Want to Learn

                </label>


                <input
                    type="text"
                    id="learnSkills"
                    placeholder="Example: Java, Node.js, AI"
                >

            </div>



            <!-- Buttons -->

            <div class="button-container">


                <button
                    type="submit"
                    class="save-btn"
                >

                    💾 Save Profile

                </button>



                <button
                    type="button"
                    class="back-btn"
                    onclick="goBack()"
                >

                    ← Back

                </button>


            </div>


        </form>


    </div>


</div>



<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->


<script>


    /* =========================
       PROFILE PHOTO UPLOAD
       ========================= */


    const photoUpload =
        document.getElementById("photoUpload");


    const profilePhoto =
        document.getElementById("profilePhoto");



    photoUpload.addEventListener(
        "change",
        function() {


            const file = this.files[0];


            if (file) {


                /* Check image */

                if (!file.type.startsWith("image/")) {

                    alert("Please select an image file.");

                    return;

                }


                /* File size check */

                if (file.size > 5 * 1024 * 1024) {

                    alert("Image size should be less than 5 MB.");

                    return;

                }


                /* Read image */

                const reader = new FileReader();


                reader.onload = function(e) {


                    profilePhoto.innerHTML =

                        `<img
                            src="${e.target.result}"
                            alt="Profile Photo"
                        >`;

                };


                reader.readAsDataURL(file);

            }

        }
    );



    /* =========================
       PROFILE FORM
       ========================= */


    const form =
        document.getElementById("profileForm");



    form.addEventListener(
        "submit",
        function(e) {


            e.preventDefault();


            /* Get values */

            const name =
                document.getElementById("name").value;


            const email =
                document.getElementById("email").value;


            const college =
                document.getElementById("college").value;


            const course =
                document.getElementById("course").value;


            const about =
                document.getElementById("about").value;


            const teachSkills =
                document.getElementById("teachSkills").value;


            const learnSkills =
                document.getElementById("learnSkills").value;



            /* Update header */

            document.getElementById(
                "displayName"
            ).innerText = name;


            document.getElementById(
                "displayCollege"
            ).innerText = college;


            document.getElementById(
                "displayCourse"
            ).innerText = course;



            /* Success */

            alert(
                "Profile Saved Successfully!"
            );


        }
    );



    /* =========================
       BACK BUTTON
       ========================= */


    function goBack() {

        window.location.href =
            "index.html";

    }


</script>


</body>

</html>
