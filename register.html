<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillConnect Register</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6C63FF, #5DE0E6);
        }

        .card {
            width: 420px;
            background: #fff;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #6C63FF;
            margin-bottom: 20px;
        }

        .logo i {
            font-size: 34px;
        }

        .logo h2 {
            font-size: 30px;
            font-weight: 700;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box i:first-child {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .input-box input {
            width: 100%;
            padding: 14px 45px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 8px rgba(108, 99, 255, 0.2);
        }

        .eye {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #6C63FF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5848e5;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .bottom a {
            color: #6C63FF;
            text-decoration: none;
            font-weight: 600;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                width: 90%;
                padding: 30px 25px;
            }

            .logo h2 {
                font-size: 26px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            <i class="fa-solid fa-users"></i>
            <h2>SkillConnect</h2>
        </div>

        <h1>Create Account</h1>

        <p>Join SkillConnect and start hiring or working.</p>

        <form id="registerForm">

            <div class="input-box">
                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                <i class="fa-solid fa-eye eye"
                    id="togglePassword"></i>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="bottom">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const toggle = document.getElementById("togglePassword");

        // Show/Hide Password
        toggle.onclick = function () {

            if (password.type === "password") {

                password.type = "text";
                confirmPassword.type = "text";

                toggle.classList.remove("fa-eye");
                toggle.classList.add("fa-eye-slash");

            } else {

                password.type = "password";
                confirmPassword.type = "password";

                toggle.classList.remove("fa-eye-slash");
                toggle.classList.add("fa-eye");
            }
        };

        // Registration Form
        form.addEventListener("submit", function (e) {

            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const pass = password.value;
            const confirm = confirmPassword.value;

            // Password length validation
            if (pass.length < 6) {
                alert("Password should be at least 6 characters.");
                return;
            }

            // Confirm password validation
            if (pass !== confirm) {
                alert("Passwords do not match.");
                return;
            }

            alert("Registration Successful!");

            /*
            Later backend se connect karna:

            fetch("http://localhost:5000/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: pass
                })
            });
            */
        });
    </script>

</body>

</html>
