<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillConnect Register</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f4f6;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{

    width:420px;

    background:white;

    padding:35px;

    border-radius:20px;

    box-shadow:0 15px 35px rgba(0,0,0,.15);

}

.logo{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    margin-bottom:20px;

    color:#2563eb;
}

.logo i{

    font-size:30px;
}

.logo h2{

    font-size:28px;
}

h1{

    text-align:center;

    margin-bottom:8px;
}

p{

    text-align:center;

    color:gray;

    margin-bottom:25px;
}

.input-box{

    position:relative;

    margin-bottom:18px;
}

.input-box i:first-child{

    position:absolute;

    left:15px;

    top:15px;

    color:#888;
}

.input-box input{

    width:100%;

    padding:14px 45px;

    border-radius:10px;

    border:1px solid #ddd;

    outline:none;

    font-size:15px;
}

.input-box input:focus{

    border:1px solid #2563eb;
}

.eye{

    position:absolute;

    right:15px;

    top:15px;

    cursor:pointer;

    color:#777;
}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    background:#1d4ed8;
}

.bottom{

    margin-top:20px;

    text-align:center;
}

.bottom a{

    text-decoration:none;

    color:#2563eb;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<i class="fa-solid fa-users"></i>

<h2>SkillConnect</h2>

</div>

<h1>Create Account</h1>

<p>Join SkillConnect and start hiring or working.</p>

<form id="registerForm">

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<i class="fa-solid fa-eye eye"
id="togglePassword"></i>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<button type="submit">

Create Account

</button>

</form>

<div class="bottom">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

<script>

const form=document.getElementById("registerForm");

const password=document.getElementById("password");

const confirmPassword=document.getElementById("confirmPassword");

const toggle=document.getElementById("togglePassword");

toggle.onclick=function(){

if(password.type==="password"){

password.type="text";

confirmPassword.type="text";

toggle.classList.remove("fa-eye");

toggle.classList.add("fa-eye-slash");

}

else{

password.type="password";

confirmPassword.type="password";

toggle.classList.remove("fa-eye-slash");

toggle.classList.add("fa-eye");

}

}

form.addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("name").value;

let email=document.getElementById("email").value;

let pass=password.value;

let confirm=confirmPassword.value;

if(pass.length<6){

alert("Password should be at least 6 characters.");

return;

}

if(pass!==confirm){

alert("Passwords do not match.");

return;

}

alert("Registration Successful!");

/*

Later backend se connect karna:

fetch("http://localhost:5000/api/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name,

email,

password:pass

})

})

*/

});

</script>

</body>
</html>
